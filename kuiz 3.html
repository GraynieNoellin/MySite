<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kuiz Topik 3</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* ========================= */
/* GLOBAL */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:
    linear-gradient(135deg,#020b2c,#071b4d,#1a0836);

    min-height:100vh;

    overflow-x:hidden;

    color:white;

    position:relative;

}

/* GRID BACKGROUND */

body::before{

    content:'';

    position:fixed;

    width:100%;
    height:100%;

    background-image:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

    background-size:60px 60px;

    z-index:-1;

}

/* ========================= */
/* BACK BUTTON */
/* ========================= */

.back-btn{

    position:fixed;

    top:30px;
    right:30px;

    width:90px;
    height:90px;

    border-radius:50%;

    border:none;

    background:
    linear-gradient(135deg,#0d47a1,#1565c0);

    display:flex;

    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:0.3s;

    z-index:999;

    box-shadow:
    0 0 20px rgba(33,150,243,0.5);

}

.back-btn:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 30px rgba(33,150,243,0.8);

}

.back-btn span{

    font-size:45px;

    color:white;

}

/* ========================= */
/* MAIN SECTION */
/* ========================= */

.quiz-section{

    padding:70px 8%;

}

/* LABEL */

.top-label{

    text-align:center;

    font-size:38px;

    font-weight:700;

    color:#00bfff;

    margin-bottom:15px;

}

/* TITLE */

.main-title{

    text-align:center;

    font-size:80px;

    font-weight:800;

    margin-bottom:20px;

}

.main-title span{

    color:#66b3ff;

    text-shadow:
    0 0 20px rgba(102,179,255,0.7);

}

/* SUBTITLE */

.subtitle{

    text-align:center;

    font-size:22px;

    color:#d8d8d8;

    margin-bottom:60px;

}

/* ========================= */
/* QUIZ BOX */
/* ========================= */

.quiz-box{

    max-width:900px;

    margin:auto;

    background:
    rgba(12,25,65,0.75);

    border:
    2px solid rgba(120,120,255,0.2);

    border-radius:35px;

    padding:50px;

    backdrop-filter:blur(10px);

}

/* QUESTION */

.question-number{

    color:#00c6ff;

    font-size:22px;

    font-weight:600;

    margin-bottom:20px;

}

.question{

    font-size:34px;

    font-weight:700;

    margin-bottom:40px;

    line-height:1.4;

}

/* OPTIONS */

.option{

    background:
    rgba(255,255,255,0.05);

    border:
    2px solid rgba(255,255,255,0.1);

    padding:22px;

    border-radius:20px;

    margin-bottom:20px;

    font-size:22px;

    cursor:pointer;

    transition:0.3s;

}

.option:hover{

    transform:translateX(8px);

    border-color:#00c6ff;

    background:
    rgba(0,198,255,0.1);

}

/* CORRECT */

.correct{

    background:#00b894 !important;

    border:none !important;

}

/* WRONG */

.wrong{

    background:#d63031 !important;

    border:none !important;

}

/* NEXT BUTTON */

.next-btn{

    margin-top:30px;

    padding:18px 40px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(90deg,#00c6ff,#7b2ff7);

    color:white;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

    display:none;

    transition:0.3s;

}

.next-btn:hover{

    transform:scale(1.05);

}

/* SCORE */

.score-box{

    text-align:center;

    margin-top:40px;

    font-size:30px;

    font-weight:700;

}

/* RESULT */

.result-box{

    text-align:center;

    display:none;

}

.result-box h2{

    font-size:60px;

    margin-bottom:20px;

}

.result-box p{

    font-size:28px;

    color:#d8d8d8;

}

/* RESPONSIVE */

@media(max-width:768px){

.main-title{

    font-size:50px;

}

.question{

    font-size:24px;

}

.option{

    font-size:18px;

}

.quiz-box{

    padding:35px 25px;

}

.back-btn{

    width:70px;
    height:70px;

}

.back-btn span{

    font-size:35px;

}

}

</style>
</head>

<body>

<!-- ========================= -->
<!-- BACK BUTTON -->
<!-- ========================= -->

<button class="back-btn" onclick="goBack()">

<span>
↩
</span>

</button>

<!-- ========================= -->
<!-- QUIZ SECTION -->
<!-- ========================= -->

<section class="quiz-section">

<div class="top-label">
🧠 KUIZ INTERAKTIF
</div>

<h1 class="main-title">
<span>PRINSIP REKA BENTUK</span>
</h1>

<p class="subtitle">
Jawab semua soalan dengan betul untuk mendapatkan skor penuh!
</p>

<!-- QUIZ BOX -->

<div class="quiz-box">

<div id="quiz-container">

<div class="question-number">
Soalan 1 / 5
</div>

<div class="question" id="question">
Prinsip yang menonjolkan objek utama dalam reka bentuk ialah...
</div>

<div class="option" onclick="checkAnswer(this, false)">
Keseimbangan
</div>

<div class="option" onclick="checkAnswer(this, true)">
Penegasan
</div>

<div class="option" onclick="checkAnswer(this, false)">
Kesatuan
</div>

<div class="option" onclick="checkAnswer(this, false)">
Pengulangan
</div>

<button class="next-btn" id="nextBtn" onclick="nextQuestion()">
Soalan Seterusnya →
</button>

</div>

<!-- SCORE -->

<div class="score-box">

🏆 Skor:
<span id="score">
0
</span>

</div>

<!-- RESULT -->

<div class="result-box" id="resultBox">

<h2>
🎉 Tahniah!
</h2>

<p id="finalScore">
Anda berjaya menjawab kuiz.
</p>

</div>

</div>

</section>

<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script>

/* ========================= */
/* QUESTIONS */
/* ========================= */

const questions = [

{
question:
"Prinsip yang menonjolkan objek utama dalam reka bentuk ialah...",

options:
["Keseimbangan","Penegasan","Kesatuan","Pengulangan"],

correct:1
},

{
question:
"Prinsip yang menggunakan elemen berulang dikenali sebagai...",

options:
["Kontras","Harmoni","Pengulangan","Penegasan"],

correct:2
},

{
question:
"Gabungan elemen yang kelihatan serasi dipanggil...",

options:
["Harmoni","Kontras","Penegasan","Kepelbagaian"],

correct:0
},

{
question:
"Perbezaan warna dan saiz untuk menarik perhatian disebut...",

options:
["Kontras","Kesatuan","Keseimbangan","Harmoni"],

correct:0
},

{
question:
"Prinsip yang menjadikan semua elemen nampak bersatu ialah...",

options:
["Kesatuan","Kontras","Pengulangan","Penegasan"],

correct:0
}

];

/* ========================= */
/* VARIABLES */
/* ========================= */

let currentQuestion = 0;

let score = 0;

/* ========================= */
/* CHECK ANSWER */
/* ========================= */

function checkAnswer(element, isCorrect){

const options =
document.querySelectorAll('.option');

options.forEach(option => {

option.style.pointerEvents = "none";

});

if(isCorrect){

element.classList.add('correct');

score++;

document.getElementById("score")
.innerHTML = score;

}

else{

element.classList.add('wrong');

options[questions[currentQuestion].correct]
.classList.add('correct');

}

document.getElementById("nextBtn")
.style.display = "inline-block";

}

/* ========================= */
/* NEXT QUESTION */
/* ========================= */

function nextQuestion(){

currentQuestion++;

if(currentQuestion < questions.length){

loadQuestion();

}

else{

showResult();

}

}

/* ========================= */
/* LOAD QUESTION */
/* ========================= */

function loadQuestion(){

document.querySelector(".question-number")
.innerHTML =
"Soalan " +
(currentQuestion + 1)
+ " / 5";

document.getElementById("question")
.innerHTML =
questions[currentQuestion].question;

const options =
document.querySelectorAll(".option");

options.forEach((option,index)=>{

option.innerHTML =
questions[currentQuestion].options[index];

option.classList.remove(
'correct',
'wrong'
);

option.style.pointerEvents = "auto";

option.setAttribute(
"onclick",
`checkAnswer(this,
${index === questions[currentQuestion].correct})`
);

});

document.getElementById("nextBtn")
.style.display = "none";

}

/* ========================= */
/* RESULT */
/* ========================= */

function showResult(){

document.getElementById("quiz-container")
.style.display = "none";

document.getElementById("resultBox")
.style.display = "block";

document.getElementById("finalScore")
.innerHTML =
"Skor akhir anda ialah "
+ score +
" / 5 🏆";

}

/* ========================= */
/* BACK BUTTON */
/* ========================= */

function goBack(){

window.location.href = "topik 3.html";

}

</script>

</body>
</html>
