<!DOCTYPE html>
<html lang="ms">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kuiz KBAT Elemen Reka Bentuk</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>

        /* ===================================================== */
        /* ===== RESET ===== */
        /* ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins',sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient( 180deg, #0a2f66, #041f47 );
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: white;
            padding: 20px;
        }

            /* ===================================================== */
            /* ===== BACKGROUND EFFECT ===== */
            /* ===================================================== */

            body::before {
                content: "";
                position: absolute;
                width: 500px;
                height: 500px;
                background: radial-gradient( rgba(255,102,0,0.15), transparent );
                top: -150px;
                left: -150px;
            }

        /* ===================================================== */
        /* ===== QUIZ WRAPPER ===== */
        /* ===================================================== */

        .quiz-wrapper {
            width: 78%;
            max-width: 1050px;
            min-height: 760px;
            padding: 40px 45px;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 38px;
            position: relative;
            z-index: 2;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            animation: fadeUp 1s ease;
        }

        /* ===================================================== */
        /* ===== EXIT BUTTON ===== */
        /* ===================================================== */

        .exit-btn {
            position: fixed;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #0a2342;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            transition: 0.3s;
            z-index: 999;
        
        }

        /* ===== ICON ===== */

        .exit-icon {
            color: white;
            font-size: 40px;
            font-weight: bold;
            line-height: 1;
        }

        /* ===== HOVER ===== */

        .exit-btn:hover {
            background: #ff6600;
            transform: translateY(-50%) scale(1.1);
        }

        /* ===================================================== */
        /* ===== TOP BAR ===== */
        /* ===================================================== */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        /* ===== LEVEL ===== */

        .level {
            background: linear-gradient( 135deg, #ff6600, #ff944d );
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(255,102,0,0.25);
        }

        /* ===== SCORE ===== */

        .score {
            font-size: 22px;
            font-weight: 700;
            color: #ffcc70;
        }

        /* ===== TIMER ===== */

        .timer {
            background: rgba(255,255,255,0.08);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ===================================================== */
        /* ===== PROGRESS ===== */
        /* ===================================================== */

        .progress-container {
            width: 100%;
            height: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            overflow: hidden;
            margin-bottom: 50px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient( 90deg, #ff6600, #ffb347 );
            transition: 0.4s;
        }

        /* ===================================================== */
        /* ===== QUESTION BOX ===== */
        /* ===================================================== */

        .question-box {
            text-align: center;
        }

        /* ===== ICON ===== */

        .question-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 35px;
            border-radius: 32px;
            background: linear-gradient( 135deg, #ff6600, #ff944d );
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            box-shadow: 0 15px 30px rgba(255,102,0,0.25);
            animation: floatIcon 3s ease-in-out infinite;
        }

        /* ===== QUESTION ===== */

        .question {
            font-size: 34px;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 700;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===================================================== */
        /* ===== OPTIONS ===== */
        /* ===================================================== */

        .options {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }

        /* ===== BUTTON ===== */

        .option-btn {
            border: none;
            padding: 22px;
            border-radius: 22px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.08);
        }

            .option-btn:hover {
                transform: scale(1.03);
                background: linear-gradient( 135deg, #ff6600, #ff944d );
                box-shadow: 0 10px 25px rgba(255,102,0,0.25);
            }

        /* ===== ANSWER ===== */

        .correct {
            background: #16a34a !important;
        }

        .wrong {
            background: #dc2626 !important;
        }

        /* ===================================================== */
        /* ===== POPUP ===== */
        /* ===================================================== */

        .popup {
            position: fixed;
            top: 30px;
            right: 30px;
            background: white;
            color: #111;
            padding: 16px 24px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(-20px);
            transition: 0.4s;
            z-index: 999;
        }

            .popup.show {
                opacity: 1;
                transform: translateY(0);
            }

        /* ===================================================== */
        /* ===== COMPLETE ===== */
        /* ===================================================== */

        .complete-screen {
            display: none;
            text-align: center;
            margin-top: 80px;
        }

            .complete-screen h1 {
                font-size: 60px;
                margin-bottom: 20px;
                color: #ffcc70;
            }

            .complete-screen p {
                font-size: 24px;
                margin-bottom: 30px;
            }

        /* ===== BADGE ===== */

        .badge {
            display: inline-block;
            padding: 18px 35px;
            border-radius: 50px;
            background: linear-gradient( 135deg, #ff6600, #ff944d );
            font-size: 22px;
            font-weight: 700;
        }

        /* ===================================================== */
        /* ===== BUTTON GROUP ===== */
        /* ===================================================== */

        .button-group {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* ===== NAV BUTTON ===== */

        .nav-btn {
            text-decoration: none;
            padding: 16px 30px;
            border-radius: 50px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
        }

        .home-btn {
            background: #0a2342;
        }

        .retry-btn {
            background: #ff6600;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
        }

        /* ===================================================== */
        /* ===== ANIMATION ===== */
        /* ===================================================== */

        @keyframes floatIcon {

            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===================================================== */
        /* ===== RESPONSIVE ===== */
        /* ===================================================== */

        @media(max-width:1100px) {

            .quiz-wrapper {
                width: 90%;
            }

            .question {
                font-size: 28px;
            }
        }

        /* ===== TABLET ===== */

        @media(max-width:768px) {

            .quiz-wrapper {
                width: 95%;
                min-height: auto;
                padding: 30px 20px;
            }

            .top-bar {
                flex-direction: column;
                align-items: center;
            }

            .question {
                font-size: 24px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .option-btn {
                font-size: 17px;
            }

            .exit-btn {
                width: 60px;
                height: 60px;
                left: 15px;
            }

            .exit-icon {
                font-size: 30px;
            }
        }

        /* ===== PHONE ===== */

        @media(max-width:500px) {

            .quiz-wrapper {
                width: 100%;
                border-radius: 25px;
                padding: 25px 18px;
            }

            .question {
                font-size: 20px;
            }

            .question-icon {
                width: 90px;
                height: 90px;
                font-size: 45px;
            }

            .level,
            .score,
            .timer {
                font-size: 15px;
            }

            .option-btn {
                font-size: 15px;
                padding: 16px;
            }

            .complete-screen h1 {
                font-size: 40px;
            }

            .complete-screen p {
                font-size: 18px;
            }

            .button-group {
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
                text-align: center;
            }
        }

        /* ===================================================== */
        /* ===== FOOTER ===== */
        /* ===================================================== */

        .footer {
            padding: 40px;
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <!-- ===================================================== -->
    <!-- ===== EXIT BUTTON ===== -->
    <!-- ===================================================== -->

    <a href="topik 2.html"
       class="exit-btn"
       title="Kembali">

        <span class="exit-icon">

            ⮌

        </span>

    </a>

    <!-- ===================================================== -->
    <!-- ===== QUIZ WRAPPER ===== -->
    <!-- ===================================================== -->

    <div class="quiz-wrapper">

        <!-- ===================================================== -->
        <!-- ===== TOP BAR ===== -->
        <!-- ===================================================== -->

        <div class="top-bar">

            <div class="level">

                🎮 KUIZ

            </div>

            <div class="score">

                ⭐ Skor :
                <span id="score">0</span>

            </div>

            <div class="timer">

                ⏳ <span id="timer">15</span>s

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- ===== PROGRESS ===== -->
        <!-- ===================================================== -->

        <div class="progress-container">

            <div class="progress-bar"
                 id="progressBar"></div>

        </div>

        <!-- ===================================================== -->
        <!-- ===== QUIZ CONTENT ===== -->
        <!-- ===================================================== -->

        <div id="quizContent">

            <div class="question-box">

                <div class="question-icon"
                     id="questionIcon">

                    🔷

                </div>

                <div class="question"
                     id="questionText">

                    Sebuah papan tanda mempunyai bentuk
                    bulat dan rata. Elemen apakah yang digunakan?

                </div>

                <div class="options"
                     id="optionsContainer">

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- ===== COMPLETE SCREEN ===== -->
        <!-- ===================================================== -->

        <div class="complete-screen"
             id="completeScreen">

            <h1>

                🏆 Tahniah!

            </h1>

            <p>

                Anda telah berjaya menyiapkan kuiz.

            </p>

            <div class="badge"
                 id="badgeText">

                PENCAPAIAN ANDA : 🥇🥇🥇🥇🥇

            </div>

            <div class="button-group">

                <a href=""
                   class="nav-btn retry-btn">

                    🔄 Main Semula

                </a>

            </div>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- ===== POPUP ===== -->
    <!-- ===================================================== -->

    <div class="popup"
         id="popup"></div>

    <!-- ===================================================== -->
    <!-- ===== SCRIPT ===== -->
    <!-- ===================================================== -->

    <script>

        /* ===================================================== */
        /* ===== QUIZ DATA ===== */
        /* ===================================================== */

        const quizData = [

            {
                icon: "➖",

                question:
                    "Seorang pelukis menggunakan banyak garisan melengkung untuk menghasilkan corak ombak. Elemen apakah yang paling dominan?",

                options:
                    ["Saiz", "Warna", "Tekstur", "Garisan"],

                correct: "Garisan"
            },

            {
                icon: "🔷",

                question:
                    "Sebuah papan tanda mempunyai bentuk bulat dan rata. Elemen apakah yang digunakan?",

                options:
                    ["Saiz", "Rupa", "Ruang", "Tekstur"],

                correct: "Rupa"
            },

            {
                icon: "⚫",

                question:
                    "Sebuah kotak hadiah mempunyai tinggi, lebar dan isipadu. Elemen apakah yang jelas ditunjukkan?",

                options:
                    ["Warna", "Garisan", "Saiz", "Bentuk"],

                correct: "Bentuk"
            },

            {
                icon: "✨",

                question:
                    "Permukaan batu terasa kasar apabila disentuh. Elemen apakah yang terlibat?",

                options:
                    ["Rupa", "Saiz", "Tekstur", "Warna"],

                correct: "Tekstur"
            },

            {
                icon: "📏",

                question:
                    "Seekor gajah kelihatan lebih besar daripada seekor kucing. Elemen apakah yang dibandingkan?",

                options:
                    ["Ruang", "Garisan", "Saiz", "Warna"],

                correct: "Saiz"
            },

            {
                icon: "🎨",

                question:
                    "Pereka menggunakan warna terang untuk menarik perhatian pengguna. Elemen apakah yang digunakan?",

                options:
                    ["Tekstur", "Warna", "Bentuk", "Garisan"],

                correct: "Warna"
            },

            {
                icon: "⬜",

                question:
                    "Susunan meja yang terlalu rapat menjadikan bilik kelihatan sempit. Elemen apakah yang kurang digunakan?",

                options:
                    ["Ruang", "Warna", "Tekstur", "Saiz"],

                correct: "Ruang"
            }

        ];

        /* ===================================================== */
        /* ===== VARIABLES ===== */
        /* ===================================================== */

        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 15;
        let timer;

        const questionText =
            document.getElementById("questionText");

        const questionIcon =
            document.getElementById("questionIcon");

        const optionsContainer =
            document.getElementById("optionsContainer");

        const scoreText =
            document.getElementById("score");

        const progressBar =
            document.getElementById("progressBar");

        const popup =
            document.getElementById("popup");

        const timerText =
            document.getElementById("timer");

        /* ===================================================== */
        /* ===== LOAD QUESTION ===== */
        /* ===================================================== */

        function loadQuestion() {

            clearInterval(timer);

            timeLeft = 15;

            timerText.innerHTML = timeLeft;

            timer =
                setInterval(updateTimer, 1000);

            let q =
                quizData[currentQuestion];

            questionText.innerHTML =
                q.question;

            questionIcon.innerHTML =
                q.icon;

            optionsContainer.innerHTML = "";

            q.options.forEach(option => {

                const button =
                    document.createElement("button");

                button.classList.add("option-btn");

                button.innerHTML = option;

                button.onclick = () =>
                    checkAnswer(button, option, q.correct);

                optionsContainer.appendChild(button);

            });

            let progress =
                (currentQuestion / quizData.length) * 100;

            progressBar.style.width =
                progress + "%";
        }

        /* ===================================================== */
        /* ===== TIMER ===== */
        /* ===================================================== */

        function updateTimer() {

            timeLeft--;

            timerText.innerHTML = timeLeft;

            if (timeLeft <= 0) {

                clearInterval(timer);

                nextQuestion();
            }
        }

        /* ===================================================== */
        /* ===== CHECK ANSWER ===== */
        /* ===================================================== */

        function checkAnswer(button, selected, correct) {

            clearInterval(timer);

            const buttons =
                document.querySelectorAll(".option-btn");

            buttons.forEach(btn => {

                btn.disabled = true;

            });

            if (selected === correct) {

                button.classList.add("correct");

                score++;

                popup.innerHTML =
                    "✅ Jawapan Betul!";
            }

            else {

                button.classList.add("wrong");

                popup.innerHTML =
                    "❌ Jawapan Salah!";
            }

            scoreText.innerHTML = score;

            popup.classList.add("show");

            setTimeout(() => {

                popup.classList.remove("show");

            }, 1500);

            setTimeout(() => {

                nextQuestion();

            }, 1500);
        }

        /* ===================================================== */
        /* ===== NEXT QUESTION ===== */
        /* ===================================================== */

        function nextQuestion() {

            currentQuestion++;

            if (currentQuestion < quizData.length) {

                loadQuestion();
            }

            else {

                showComplete();
            }
        }

        /* ===================================================== */
        /* ===== COMPLETE ===== */
        /* ===================================================== */

        function showComplete() {

            clearInterval(timer);

            document.getElementById("quizContent")
                .style.display = "none";

            document.getElementById("completeScreen")
                .style.display = "block";

            progressBar.style.width = "100%";

            let badge =
                document.getElementById("badgeText");

            if (score === 7) {

                badge.innerHTML =
                    "PENCAPAIAN ANDA : 🥇🥇🥇🥇🥇";
            }

            else if (score >= 5) {

                badge.innerHTML =
                    "PENCAPAIAN ANDA : 🥈🥈🥈";
            }

            else {

                badge.innerHTML =
                    "PENCAPAIAN ANDA : 🥉";
            }
        }

        /* ===================================================== */
        /* ===== START ===== */
        /* ===================================================== */

        loadQuestion();

    </script>

</body>
</html>
