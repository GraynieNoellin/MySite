<!DOCTYPE html>
<html lang="ms">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Game Show Quiz RBT</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap"
          rel="stylesheet">

    <style>

        /* ===================================================== */
        /* ===== RESET ===== */
        /* ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins',sans-serif;
        }

        body {
            background: radial-gradient( circle at top, #0f172a, #020617 );
            height: 100vh;
            overflow: hidden;
            color: white;
            display: flex;
        }

            /* ===================================================== */
            /* ===== GRID BACKGROUND ===== */
            /* ===================================================== */

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: linear-gradient( rgba(255,255,255,0.03) 1px, transparent 1px ), linear-gradient( 90deg, rgba(255,255,255,0.03) 1px, transparent 1px );
                background-size: 80px 80px;
                z-index: -2;
            }

        /* ===================================================== */
        /* ===== GLOW ===== */
        /* ===================================================== */

        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
        }

        .glow1 {
            background: rgba(34,211,238,0.15);
            top: -100px;
            left: -100px;
        }

        .glow2 {
            background: rgba(168,85,247,0.15);
            bottom: -100px;
            right: -100px;
        }

        /* ===================================================== */
        /* ===== RETURN BUTTON ===== */
        /* ===================================================== */

        .return-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 45px;
            z-index: 999;
            transition: 0.3s;
        }

            .return-btn:hover {
                transform: scale(1.08) rotate(-8deg);
                background: linear-gradient( 135deg, #22d3ee, #0ea5e9 );
                color: #00141b;
            }

        /* ===================================================== */
        /* ===== SIDEBAR ===== */
        /* ===================================================== */

        .sidebar {
            width: 280px;
            height: 100vh;
            background: rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ===== LOGO ===== */

        .logo {
            font-size: 60px;
            font-weight: 900;
            margin-bottom: 25px;
        }

        /* ===== INFO ===== */

        .quiz-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== CARD ===== */

        .info-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 25px;
            padding: 25px;
            text-align: center;
        }

            .info-card h3 {
                font-size: 18px;
                color: #cbd5e1;
                margin-bottom: 10px;
            }

            .info-card h1 {
                font-size: 42px;
                color: #22d3ee;
            }

        /* ===================================================== */
        /* ===== TIMER ===== */
        /* ===================================================== */

        .timer-circle {
            width: 140px;
            height: 140px;
            margin: auto;
            border-radius: 50%;
            background: conic-gradient( #22d3ee 100%, rgba(255,255,255,0.08) 0% );
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

            .timer-circle::before {
                content: "";
                position: absolute;
                width: 105px;
                height: 105px;
                border-radius: 50%;
                background: #020617;
            }

        .timer-value {
            position: relative;
            z-index: 2;
            font-size: 34px;
            font-weight: 900;
        }

        /* ===================================================== */
        /* ===== QUIZ CONTAINER ===== */
        /* ===================================================== */

        .quiz-container {
            flex: 1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 40px;
        }

        /* ===================================================== */
        /* ===== QUIZ CARD ===== */
        /* ===================================================== */

        .quiz-card {
            width: 100%;
            max-width: 950px;
        }

        /* ===================================================== */
        /* ===== QUESTION ===== */
        /* ===================================================== */

        .question-box {
            text-align: center;
            margin-bottom: 35px;
        }

        /* ===== ICON ===== */

        .question-icon {
            width: 110px;
            height: 110px;
            margin: auto auto 25px;
            border-radius: 30px;
            background: linear-gradient( 135deg, #8b5cf6, #22d3ee );
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            box-shadow: 0 20px 45px rgba(34,211,238,0.25);
            animation: floatIcon 3s ease-in-out infinite;
        }

        /* ===== QUESTION ===== */

        .question-box h2 {
            font-size: clamp(28px,3vw,48px);
            line-height: 1.4;
            font-weight: 900;
        }

        /* ===================================================== */
        /* ===== ANSWER GRID ===== */
        /* ===================================================== */

        .answer-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 20px;
        }

            /* ===== BUTTON ===== */

            .answer-grid button {
                min-height: 100px;
                padding: 20px;
                border: none;
                border-radius: 30px;
                font-size: 22px;
                font-weight: 800;
                color: white;
                cursor: pointer;
                transition: 0.3s;
            }

                /* ===== COLORS ===== */

                .answer-grid button:nth-child(1) {
                    background: linear-gradient( 135deg, #3b82f6, #2563eb );
                }

                .answer-grid button:nth-child(2) {
                    background: linear-gradient( 135deg, #ef4444, #dc2626 );
                }

                .answer-grid button:nth-child(3) {
                    background: linear-gradient( 135deg, #facc15, #eab308 );
                    color: #111827;
                }

                .answer-grid button:nth-child(4) {
                    background: linear-gradient( 135deg, #22c55e, #16a34a );
                }

                /* ===== HOVER ===== */

                .answer-grid button:hover {
                    transform: scale(1.03);
                    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
                }

        /* ===== STATUS ===== */

        .correct {
            outline: 5px solid white;
        }

        .wrong {
            opacity: 0.5;
        }

        /* ===================================================== */
        /* ===== NEXT ===== */
        /* ===================================================== */

        .next-btn {
            width: 100%;
            margin-top: 25px;
            padding: 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient( 135deg, #22d3ee, #0ea5e9 );
            color: #00141b;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }

            .next-btn:hover {
                transform: scale(1.02);
            }

        /* ===================================================== */
        /* ===== RESULT ===== */
        /* ===================================================== */

        .result-screen {
            text-align: center;
        }

            .result-screen h1 {
                font-size: 80px;
                margin-bottom: 20px;
            }

            .result-screen h2 {
                font-size: 50px;
                color: #22d3ee;
                margin-bottom: 15px;
            }

            .result-screen p {
                font-size: 28px;
                color: #e2e8f0;
            }

        /* ===================================================== */
        /* ===== ANIMATION ===== */
        /* ===================================================== */

        @keyframes floatIcon {

            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* ===================================================== */
        /* ===== RESPONSIVE ===== */
        /* ===================================================== */

        @media(max-width:1000px) {

            body {
                flex-direction: column;
                overflow: auto;
            }

            .sidebar {
                width: 100%;
                height: auto;
            }

            .answer-grid {
                grid-template-columns: 1fr;
            }

            .quiz-container {
                height: auto;
                padding: 30px 20px;
            }

            .question-box h2 {
                font-size: 30px;
            }

            .answer-grid button {
                min-height: 85px;
                font-size: 18px;
            }
        }
    </style>

</head>

<body>

    <!-- ===================================================== -->
    <!-- ===== RETURN BUTTON ===== -->
    <!-- ===================================================== -->

    <a href="index.html"
       class="return-btn">

        ↩

    </a>

    <!-- ===================================================== -->
    <!-- ===== GLOW ===== -->
    <!-- ===================================================== -->

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <!-- ===================================================== -->
    <!-- ===== SIDEBAR ===== -->
    <!-- ===================================================== -->

    <div class="sidebar">

        <div>

            <div class="logo">

                QUIZ

            </div>

            <div class="quiz-info">

                <!-- ===== SCORE ===== -->

                <div class="info-card">

                    <h3>

                        SKOR

                    </h3>

                    <h1 id="score">

                        0

                    </h1>

                </div>

                <!-- ===== QUESTION ===== -->

                <div class="info-card">

                    <h3>

                        SOALAN

                    </h3>

                    <h1 id="questionNumber">

                        1/5

                    </h1>

                </div>

            </div>

        </div>

        <!-- ===== TIMER ===== -->

        <div class="timer-circle"
             id="timerCircle">

            <div class="timer-value"
                 id="timerValue">

                15

            </div>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- ===== MAIN QUIZ ===== -->
    <!-- ===================================================== -->

    <div class="quiz-container">

        <div class="quiz-card">

            <!-- ===== QUESTION ===== -->

            <div class="question-box">

                <div class="question-icon"
                     id="questionIcon">

                    💡

                </div>

                <h2 id="question">

                    Apakah maksud reka bentuk?

                </h2>

            </div>

            <!-- ===== ANSWERS ===== -->

            <div class="answer-grid"
                 id="answers">

            </div>

            <!-- ===== NEXT ===== -->

            <button class="next-btn"
                    onclick="nextQuestion()">

                TERUSKAN →

            </button>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- ===== SCRIPT ===== -->
    <!-- ===================================================== -->

    <script>

        /* ===================================================== */
        /* ===== QUESTIONS ===== */
        /* ===================================================== */

        const questions = [

            {
                icon: "💡",

                question:
                    "Apakah maksud reka bentuk?",

                answers:
                    [
                        "Proses menghasilkan idea kreatif",
                        "Menghapuskan produk",
                        "Mengubah warna",
                        "Membina bunyi"
                    ],

                correct: 0
            },

            {
                icon: "📱",

                question:
                    "Apakah fungsi utama teknologi?",

                answers:
                    [
                        "Menyukarkan kerja",
                        "Memudahkan kehidupan",
                        "Menghasilkan bunyi",
                        "Menghapuskan fungsi"
                    ],

                correct: 1
            },

            {
                icon: "🛠️",

                question:
                    "Yang manakah contoh teknologi?",

                answers:
                    [
                        "Telefon pintar",
                        "Kertas kosong",
                        "Pensel warna",
                        "Kotak kayu"
                    ],

                correct: 0
            },

            {
                icon: "🚀",

                question:
                    "Apakah kepentingan reka bentuk?",

                answers:
                    [
                        "Menjadikan produk lebih menarik",
                        "Menyusahkan pengguna",
                        "Mengurangkan fungsi",
                        "Menghapuskan penggunaan"
                    ],

                correct: 0
            },

            {
                icon: "🎨",

                question:
                    "Reka bentuk yang baik membantu pengguna dengan cara?",

                answers:
                    [
                        "Menyebabkan kerosakan",
                        "Memudahkan penggunaan",
                        "Meningkatkan masalah",
                        "Menghapuskan fungsi"
                    ],

                correct: 1
            }

        ];

        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 15;
        let timer;

        /* ===================================================== */
        /* ===== LOAD QUESTION ===== */
        /* ===================================================== */

        function loadQuestion() {

            clearInterval(timer);

            timeLeft = 15;

            startTimer();

            document.getElementById("question")
                .innerText =
                questions[currentQuestion].question;

            document.getElementById("questionIcon")
                .innerText =
                questions[currentQuestion].icon;

            document.getElementById("questionNumber")
                .innerText =
                `${currentQuestion + 1}/5`;

            const answerBox =
                document.getElementById("answers");

            answerBox.innerHTML = "";

            questions[currentQuestion].answers
                .forEach((answer, index) => {

                    const button =
                        document.createElement("button");

                    button.innerText = answer;

                    button.onclick = () => {

                        if (index ===
                            questions[currentQuestion].correct) {

                            checkAnswer(button, true);

                        } else {

                            checkAnswer(button, false);
                        }
                    };

                    answerBox.appendChild(button);

                });

        }

        /* ===================================================== */
        /* ===== TIMER ===== */
        /* ===================================================== */

        function startTimer() {

            timer =
                setInterval(() => {

                    timeLeft--;

                    document.getElementById("timerValue")
                        .innerText = timeLeft;

                    const percent =
                        (timeLeft / 15) * 100;

                    document.getElementById("timerCircle")
                        .style.background =
                        `conic-gradient(
#22d3ee ${percent}%,
rgba(255,255,255,0.08) 0%
)`;

                    if (timeLeft <= 0) {

                        clearInterval(timer);

                        nextQuestion();
                    }

                }, 1000);

        }

        /* ===================================================== */
        /* ===== CHECK ANSWER ===== */
        /* ===================================================== */

        function checkAnswer(button, isCorrect) {

            clearInterval(timer);

            const buttons =
                document.querySelectorAll(".answer-grid button");

            buttons.forEach(btn => {

                btn.disabled = true;
            });

            if (isCorrect) {

                button.classList.add("correct");

                score++;

                document.getElementById("score")
                    .innerText = score;

            } else {

                button.classList.add("wrong");

                buttons[
                    questions[currentQuestion].correct
                ]
                    .classList.add("correct");
            }

        }

        /* ===================================================== */
        /* ===== NEXT ===== */
        /* ===================================================== */

        function nextQuestion() {

            currentQuestion++;

            if (currentQuestion >= questions.length) {

                document.querySelector(".quiz-container")
                    .innerHTML = `

<div class="result-screen">

<h1>

🏆

</h1>

<h2>

TAHNIAH!

</h2>

<p>

Anda berjaya menamatkan kuiz.

</p>

<p>

Skor Akhir: ${score}/5

</p>

</div>

`;

                return;
            }

            loadQuestion();

        }

        /* ===================================================== */
        /* ===== START ===== */
        /* ===================================================== */

        loadQuestion();

    </script>

</body>
</html>
